name: Build and run pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: calc
    steps:
      - uses: actions/checkout@v4
        name: Get code
      - run: docker build -t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${{github.sha}} .
        name: Build image
      - run: docker images
        name: List Images
      - run: docker run --rm ${IMAGE_NAME}:latest
        name: Run the container with the build image
