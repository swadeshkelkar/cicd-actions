name: Build, Run and Push Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/swadeshkelkar/calc
    steps:
      - uses: actions/checkout@v4
        name: Get code
      - run: docker build -t ${IMAGE}:latest -t ${IMAGE}:${{github.sha}} .
        name: Build image
      - run: docker images
        name: List Images
      - run: docker run --rm ${IMAGE}:${{github.sha}}
        name: Run the container with the build image
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
        name: Login to github docker registry
      - if: github.event_name == 'push'
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{github.sha}}
        name: Push image to registry
