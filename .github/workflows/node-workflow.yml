name: Node Workflow
on:
  workflow_dispatch: 
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: poll-api
    steps:
      - uses: actions/checkout@v4
      - run: | 
          docker build \
          -t $IMAGE_NAME:${{github.sha}} \
          -t $IMAGE_NAME:latest
          .
      - run: docker run $IMAGE_NAME:${{github.sha}} npm test
