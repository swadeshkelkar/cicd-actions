name: Tests

# Run on every push, any branch
on:
 push:
   branches: [main]
 pull_request:
   branches: [main]

jobs:
  test:
    env: 
      SAMPLE_VARIABLE: "env1"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.py-version}}
          cache: pip
        
      - name: Print environment variable
        run: echo $SAMPLE_VARIABLE

      - name: Print secret
        run: echo ${{secrets.DEMO_SECRE}}

      - name: Install test tool
        run: pip install pytest

      - name: Run tests
        run: pytest
