name: Tests

# Run on every push, any branch
on:
 push:
   branches: [main]
 pull_request:
   branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tool
        run: pip install pytest

      - name: Run tests
        run: pytest
