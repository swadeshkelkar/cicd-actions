name: Lint, Test and Push Pipeline #this is a multi job pipeline with docker actions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/swadeshkelkar/calc
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: calc-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - run: docker run --rm calc-app:latest
  publish:
    needs: [lint,test]
    if: github.event_name == 'push'
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ${{env.IMAGE}}:latest
            ${{env.IMAGE}}:${{github.sha}}
          
