name: Build and Deployment (Canary)
on:
  workflow_dispatch:
  push:
    branches: main
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE: ghcr.io/swadeshkelkar/calc
    outputs:
      tag: ${{github.sha}}
    steps:
      - uses: actions/checkout@v4
        name: Get code
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{env.IMAGE}}:${{github.sha}}
        name: Build image
  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying image with tag ${{needs.build.outputs.tag}}"
  canary:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "10% traffic"
      - run: exit 0
  full-rollout:
    needs: [canary, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "100% traffic"
  rollback:
    needs: [canary]
    if: failure()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "back to 0%"
    
