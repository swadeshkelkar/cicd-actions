name: Capstone Enhanced Pipeline
on:
  push:
    branches: main
    tags: 'v*'
  pull_request:
    branches: main
permissions:
  contents: read
env:
  IMAGE: ghcr.io/swadeshkelkar/calc
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.12"
      - run: |
          pip install flake8
          flake8 .
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: ${{matrix.python-version}}
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - run: pytest
      
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN}}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3

      - id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 #v5
        with:
          images: ${{env.IMAGE}}
          tags: |
              type=sha,format=long,prefix=
              type=semver,pattern={{version}}
      
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 #v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          push: true

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - run: |
          docker pull $IMAGE:${{github.sha}}
          docker run --rm $IMAGE:${{github.sha}} \
            python -c "from calc import add; assert add(2,3)==5; print('Smoke test passed');"
            
  deploy-staging:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      cancel-in-progress: false
      group: staging
    steps:
     - run: echo "Deploying $IMAGE:${{github.sha}} to staging environment"
     - run: echo "Smoke test passed on staging"

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - run: echo "Deploying $IMAGE:${{github.ref_name}} to production environment"
      
  production-rollback:
    needs: deploy-production
    if: failure() && needs.deploy-production.result == 'failure'
    environment: production-rollback
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rolling back production to the previous image"
      
